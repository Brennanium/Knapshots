name: Knapshots editor compatibility

on:
  workflow_dispatch:
    inputs:
      ide_version:
        description: Android Studio version, build, or latest-stable
        default: '2026.2.2.8'
        required: true
      runner:
        description: Select which operating systems to test
        type: choice
        options: [all, ubuntu, macos]
        default: all

permissions:
  contents: read

jobs:
  editor:
    name: Android Studio ${{ inputs.ide_version }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.runner == 'ubuntu' && '["ubuntu-latest"]' || inputs.runner == 'macos' && '["macos-15"]' || '["ubuntu-latest", "macos-15"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Save JDK 25 path
        run: echo "KNAPSHOTS_JDK25=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run Knapshots editor assertions
        env:
          KNAPSHOTS_CHECKOUT: ${{ github.workspace }}
          IDE_VERSION: ${{ inputs.ide_version }}
        run: |
          set -eu
          export GRADLE_OPTS="-Dorg.gradle.java.installations.paths=$KNAPSHOTS_JDK25"
          chmod +x ci/knapshots-editor/editor-driver.sh
          ./gradlew -p ci/knapshots-editor editorCompatibility --ide-version "$IDE_VERSION" --no-configuration-cache
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: knapshots-editor-${{ matrix.os }}
          path: |
            ci/knapshots-editor/build/reports/knapshots/
            build/ide-integration/
            knapshots-intellij/build/editor-inspection-sandbox/log/
            knapshots-ide-runner/build/reports/tests/
            knapshots-ide-runner/build/test-results/
          if-no-files-found: warn
          include-hidden-files: true
