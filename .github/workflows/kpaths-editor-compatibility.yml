name: KPaths editor compatibility

on:
  workflow_dispatch:
    inputs:
      ide_version:
        description: Android Studio release selector
        default: '2026.2.2.8'
        required: true
      kpaths_ref:
        description: KPaths branch or commit
        default: ci/ide-compatibility/knapshots-integration
        required: true

permissions:
  contents: read

jobs:
  editor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          path: knapshots
      - uses: actions/checkout@v6
        with:
          repository: Brennanium/KPaths
          ref: ${{ inputs.kpaths_ref }}
          path: kpaths
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Save JDK 25 path
        run: echo "KPATHS_JDK25=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run KPaths editor compatibility
        env:
          KPATHS_CHECKOUT: ${{ github.workspace }}/kpaths
          IDE_VERSION: ${{ inputs.ide_version }}
        run: |
          export GRADLE_OPTS="-Dorg.gradle.java.installations.paths=$KPATHS_JDK25"
          chmod +x knapshots/ci/kpaths-editor/editor-driver.sh
          knapshots/gradlew -p knapshots/ci/kpaths-editor editorCompatibility --ide-version "$IDE_VERSION" --no-configuration-cache
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: editor-compatibility-${{ matrix.os }}
          path: |
            knapshots/ci/kpaths-editor/build/reports/knapshots/
            kpaths/kpaths-kefs-ide-fixture/build/consumer-probe*.log
            kpaths/kpaths-kefs-ide-fixture/build/consumer-probe*.txt
            kpaths/kpaths-kefs-ide-fixture/build/ide-probe/**/log/
          if-no-files-found: warn
