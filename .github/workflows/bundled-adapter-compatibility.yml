name: Bundled adapter compatibility

on:
  push:
    branches: [feature/bundled-adapter-matrix]
  workflow_dispatch:
    inputs:
      ide_versions:
        description: JSON array of Android Studio release selectors
        required: true
        default: '["2026.2.2.10", "2026.2.1.8", "2026.1.4.8"]'
      baseline_ide:
        description: IDE used once to compile the candidate adapter
        required: true
        default: '2026.1.4.8'
permissions:
  contents: read
jobs:
  candidate:
    name: Build one bundled candidate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '25' }
      - name: Save JDK 25 path
        run: echo "KNAPSHOTS_JDK25=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and publish candidate locally
        env:
          KNAPSHOTS_CHECKOUT: ${{ github.workspace }}
          KNAPSHOTS_VERSION: 0.1.0-ci
          BASELINE_IDE: ${{ inputs.baseline_ide || '2026.1.4.8' }}
        run: |
          export GRADLE_OPTS="-Dorg.gradle.java.installations.paths=$KNAPSHOTS_JDK25"
          ./gradlew -p ci/bundled-adapter-build-matrix editorCompatibility --ide-version "$BASELINE_IDE" --no-configuration-cache
      - uses: actions/upload-artifact@v6
        with:
          name: bundled-adapter-candidate
          path: build/consumer-repository/
          if-no-files-found: error
  adapter:
    needs: candidate
    name: Studio ${{ matrix.ide }} / fixed candidate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        ide: ${{ fromJSON(inputs.ide_versions || '["2026.2.2.10", "2026.2.1.8", "2026.1.4.8"]') }}
    steps:
      - uses: actions/checkout@v6
        with: { path: knapshots }
      - uses: actions/download-artifact@v7
        with:
          name: bundled-adapter-candidate
          path: knapshots/build/consumer-repository
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '25' }
      - name: Save JDK 25 path
        run: echo "KNAPSHOTS_JDK25=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Verify the bundled adapter with the fixture compiler
        env:
          KNAPSHOTS_CHECKOUT: ${{ github.workspace }}/knapshots
          KNAPSHOTS_REPOSITORY: ${{ github.workspace }}/knapshots/build/consumer-repository
          KNAPSHOTS_VERSION: 0.1.0-ci
          IDE_VERSION: ${{ matrix.ide }}
          KNAPSHOTS_FIXTURE_TRACE: 'true'
          KNAPSHOTS_RETAIN_IDE_LOGS: 'true'
          KNAPSHOTS_EXPERIMENTAL_REFRESH_PSI: ${{ matrix.ide == '2026.1.4.8' && 'true' || 'false' }}
          JAVA_TOOL_OPTIONS: -Didea.log.debug.categories=com.github.mr3zee.kefs
        run: |
          export GRADLE_OPTS="-Dorg.gradle.java.installations.paths=$KNAPSHOTS_JDK25"
          knapshots/gradlew -p knapshots/ci/bundled-adapter-matrix editorCompatibility --ide-version "$IDE_VERSION" --no-configuration-cache
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bundled-adapter-${{ strategy.job-index }}
          path: |
            knapshots/ci/bundled-adapter-matrix/build/reports/knapshots/
            knapshots/ci/bundled-adapter-smoke/build/reports/
            knapshots/ci/bundled-adapter-smoke/build/test-results/
            knapshots/ci/bundled-adapter-smoke/build/fixture-repository/
            knapshots/ci/bundled-adapter-smoke/build/editor-inspections/**/ide-sandbox/log/idea.log
            knapshots/ci/bundled-adapter-smoke/build/editor-inspections/**/project/build.gradle.kts
            knapshots/ci/bundled-adapter-smoke/build/editor-inspections/**/project/settings.gradle.kts
            knapshots/ci/bundled-adapter-smoke/build/editor-inspections/**/project/.idea/kotlin-plugins.xml
          if-no-files-found: warn
          include-hidden-files: true
